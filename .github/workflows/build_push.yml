name: CI

on:
  push:
    branches:
      - master
    paths:
      - '**'
      - '!**.md'
      - '!.github/**'
      - '.github/scripts/**'
      - '.github/workflows/build_push.yml'
  # Manual trigger. Enable `full_build` to publish every extension.
  workflow_dispatch:
    inputs:
      full_build:
        description: 'Build and publish every extension'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CI_CHUNK_SIZE: 65
  IS_PR_CHECK: false
  REPO_BRANCH: repo
  FULL_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.full_build || false }}

jobs:
  prepare:
    name: Prepare job
    runs-on: 'ubuntu-24.04'
    outputs:
      matrix: ${{ steps.generate-matrices.outputs.matrix }}
      delete: ${{ steps.generate-matrices.outputs.delete }}
    steps:
      - name: Checkout ${{ github.ref_name }} branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Find lib changes
        id: modified-libs
        uses: tj-actions/changed-files@v47
        with:
          files: lib/
          files_ignore: lib/**.md
          files_separator: " "
          safe_output: false

      # Bump extensions that use a modified lib. This commit is made with
      # GITHUB_TOKEN, so it does not trigger another workflow run.
      - name: Bump extensions that uses a modified lib
        if: steps.modified-libs.outputs.any_changed == 'true'
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.sha }}
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          chmod +x ./.github/scripts/bump-versions.py
          ./.github/scripts/bump-versions.py "$COMMIT_MESSAGE" ${{ steps.modified-libs.outputs.all_changed_files }}
          git push

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Get last successful CI commit
        id: last_successful_ci_commit
        uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: ${{ github.ref_name }}

      # nx-set-shas can return HEAD (or nothing) on the very first run. Fall back
      # to the pushed range so the first push still builds its extensions.
      - name: Resolve diff base
        id: diff-base
        run: |
          BASE="${{ steps.last_successful_ci_commit.outputs.base }}"
          if [ -z "$BASE" ] || [ "$BASE" = "${GITHUB_SHA}" ]; then
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then
            BASE="HEAD~1"
          fi
          echo "Resolved diff base: $BASE"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - id: generate-matrices
        name: Create output matrices
        run: |
          python ./.github/scripts/generate-build-matrices.py ${{ steps.diff-base.outputs.base }} Release

  build:
    name: Build extensions (${{ matrix.chunk.number }})
    needs: prepare
    runs-on: 'ubuntu-24.04'
    if: ${{ toJson(fromJson(needs.prepare.outputs.matrix).chunk) != '[]' }}
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout ${{ github.ref_name }} branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ matrix.chunk.number > 1 }}

      - name: Prepare signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "Missing SIGNING_KEY repository secret. See REPO.md."
            exit 1
          fi
          echo "$SIGNING_KEY" | base64 -d > signingkey.jks
          chmod 600 signingkey.jks

      - name: Build extensions (${{ matrix.chunk.number }})
        env:
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          MEGACLOUD_API: ${{ secrets.MEGACLOUD_API }}
          KISSKH_API: ${{ secrets.KISSKH_API }}
          KISSKH_SUB_API: ${{ secrets.KISSKH_SUB_API }}
          KAISVA: ${{ secrets.KAISVA }}
          TMDB_API: ${{ secrets.TMDB_API }}
        run: |
          set -euo pipefail

          # settings.gradle.kts only loads the modules that are being built.
          MODULES="$(echo '${{ toJson(matrix.chunk.modules) }}' \
            | jq -r 'map(sub("^:src:"; "") | sub(":assemble[^:]*$"; "") | gsub(":"; "/")) | join(",")')"
          TASKS="$(echo '${{ toJson(matrix.chunk.modules) }}' | jq -r 'join(" ")')"

          echo "CI_MODULES=$MODULES"
          echo "Tasks: $TASKS"

          CI_MODULES="$MODULES" ./gradlew $TASKS

      - name: Upload APKs (${{ matrix.chunk.number }})
        uses: actions/upload-artifact@v5
        with:
          name: "individual-apks-${{ matrix.chunk.number }}"
          path: "**/*.apk"
          retention-days: 1

      - name: Clean up CI files
        if: always()
        run: rm -f signingkey.jks

  publish:
    name: Publish extension repo
    needs: [prepare, build]
    runs-on: 'ubuntu-24.04'
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v6
        with:
          path: ~/apk-artifacts

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Checkout ${{ github.ref_name }} branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          path: source

      - name: Create repo artifacts
        working-directory: source
        run: |
          set -euo pipefail

          python ./.github/scripts/move-built-apks.py

          INSPECTOR_URL="$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" \
            https://api.github.com/repos/komikku-app/aniyomi-extensions-inspector/releases/latest \
            | jq -r '.assets[0].browser_download_url')"
          if [ -z "$INSPECTOR_URL" ] || [ "$INSPECTOR_URL" = "null" ]; then
            echo "Could not resolve the extensions inspector release."
            exit 1
          fi
          curl -fL "$INSPECTOR_URL" -o ./Inspector.jar
          java -jar ./Inspector.jar "repo/apk" "output.json" "tmp"
          python ./.github/scripts/create-repo.py

      - name: Check out or create repo branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init repo-branch
          cd repo-branch
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch --depth=1 origin "${REPO_BRANCH}"; then
            git checkout -B "${REPO_BRANCH}" FETCH_HEAD
          else
            echo "Creating new orphan ${REPO_BRANCH} branch"
            git checkout --orphan "${REPO_BRANCH}"
            mkdir -p apk icon
            echo '[]' > index.min.json
            echo '[]' > index.json
          fi

      - name: Merge repo
        env:
          DELETE_LIST: ${{ needs.prepare.outputs.delete }}
        run: |
          cd repo-branch
          python ../source/.github/scripts/merge-repo.py "$DELETE_LIST" 'source/repo'

      - name: Commit and push
        run: |
          cd repo-branch
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "Update extensions repo" -m "Built from ${GITHUB_SHA}"
          git push origin "HEAD:${REPO_BRANCH}"

      - name: Print repo URL
        run: |
          echo "Add this URL in Aniyomi/Anikku:"
          echo "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${REPO_BRANCH}/index.min.json"
